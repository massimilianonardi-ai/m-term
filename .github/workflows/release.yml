name: Publish immutable m-term source release
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'res/**'
      - 'build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual package sources and verify release archive
        shell: sh
        run: |
          set -eu
          sh -n build.sh
          sh build.sh release
          cd release
          sha256sum m-term-v0.1.0-all.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf m-term-v0.1.0-all.tar.gz | grep -q '^bin/'
          tar -tzf m-term-v0.1.0-all.tar.gz | grep -q '^lib/sh/'
      - name: Publish immutable v0.1.0 only if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 exists, refusing to replace the immutable release'
            exit 0
          fi
          gh release create v0.1.0 release/m-term-v0.1.0-all.tar.gz release/SHA256SUMS \
            --target "$GITHUB_SHA" --title 'm-term v0.1.0' \
            --notes 'First-party m-term sources for the existing m package manager.'
